                <script>
    $(document).ready(function(){
        // Copy-color-to-clipboard
    
        $("a[href='#copy-color']")
            .attr('onclick', 'copyColor(event)')
            .addClass('copy-color-btn')
            .removeAttr('href');
    
    });
    
    function copyColor(e) {
        e.preventDefault();
      var copyText = document.getElementById("accessibility-color");
      copyText.select();
      document.execCommand("copy");
      $(".copy-color-btn").text('copied');
    }
    </script>
    <div style="overflow: hidden; display: block; height: 1px; width: 1px">
       <input type="text" value="#0583F2" id="accessibility-color"> 
    </div>
